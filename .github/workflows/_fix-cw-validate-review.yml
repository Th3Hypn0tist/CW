name: One-shot cw_validate review fixes

on:
  push:
    branches:
      - linter/cw-artifact-validator-v1
    paths:
      - '.github/workflows/_fix-cw-validate-review.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linter/cw-artifact-validator-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('linter/cw_validate.py')
          s = p.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          replace_once('VALIDATOR_VERSION = "1.0.0"', 'VALIDATOR_VERSION = "1.1.0"')

          replace_once(
          '''class Context:
              def __init__(self) -> None:
                  self.findings: List[Finding] = []
                  self.unready_reasons: List[str] = []

              def add(self, severity: str, code: str, file: Path | str, path: str, message: str) -> None:
                  self.findings.append(Finding(severity, code, str(file), path or "$", message))

              def error(self, code: str, file: Path | str, path: str, message: str) -> None:
                  self.add("ERROR", code, file, path, message)

              def warn(self, code: str, file: Path | str, path: str, message: str) -> None:
                  self.add("WARNING", code, file, path, message)

              def unready(self, code: str, file: Path | str, path: str, message: str) -> None:
                  self.add("UNREADY", code, file, path, message)
                  self.unready_reasons.append(message)
          ''',
          '''class Context:
              def __init__(self) -> None:
                  self.findings: List[Finding] = []

              def add(self, severity: str, code: str, file: Path | str, path: str, message: str) -> None:
                  self.findings.append(Finding(severity, code, str(file), path or "$", message))

              def error(self, code: str, file: Path | str, path: str, message: str) -> None:
                  self.add("ERROR", code, file, path, message)

              def warn(self, code: str, file: Path | str, path: str, message: str) -> None:
                  self.add("WARNING", code, file, path, message)

              def unready(self, code: str, file: Path | str, path: str, message: str) -> None:
                  self.add("UNREADY", code, file, path, message)
          ''')

          load_input_start = s.index('def load_input(')
          load_input_end = s.index('\n\ndef as_dict_list', load_input_start)
          s = s[:load_input_start] + '''def is_cw_contract_candidate(data: Mapping[str, Any]) -> bool:
              """Content-based directory discovery; filenames and paths remain non-semantic."""
              fmt = data.get("format")
              if isinstance(fmt, dict) and "contract_format" in fmt:
                  return True
              # Also keep structurally CW-looking documents so malformed format metadata
              # is reported by validation instead of being silently skipped.
              return all(key in data for key in ("identity", "entities", "scope", "constraints"))


          def load_input(input_path: Path, ctx: Context) -> List[ContractDocument]:
              if not input_path.exists():
                  raise RuntimeError(f"input does not exist: {input_path}")

              paths: List[Path]
              explicit_single = input_path.is_file()
              if explicit_single:
                  if input_path.suffix.lower() != ".json":
                      raise RuntimeError("single-file input must be a .json file")
                  paths = [input_path]
              elif input_path.is_dir():
                  paths = sorted(p for p in input_path.rglob("*.json") if p.is_file())
                  if not paths:
                      raise RuntimeError("input directory contains no .json files")
              else:
                  raise RuntimeError("input must be a JSON file or directory")

              docs: List[ContractDocument] = []
              for path in paths:
                  try:
                      data = read_json(path)
                      if not explicit_single and not is_cw_contract_candidate(data):
                          ctx.warn(
                              "NON_CW_JSON_IGNORED",
                              path,
                              "$",
                              "JSON file does not identify or structurally resemble a CW canonical contract; ignored during directory discovery",
                          )
                          continue
                      docs.append(ContractDocument(path, data))
                  except DuplicateKeyError as exc:
                      ctx.error("JSON_DUPLICATE_KEY", path, "$", str(exc))
                  except json.JSONDecodeError as exc:
                      ctx.error("JSON_PARSE_ERROR", path, "$", f"{exc.msg} at line {exc.lineno}, column {exc.colno}")
                  except Exception as exc:
                      ctx.error("JSON_LOAD_ERROR", path, "$", str(exc))

              if input_path.is_dir() and not docs and not any(f.severity == "ERROR" for f in ctx.findings):
                  raise RuntimeError("input directory contains no CW canonical contract documents")
              return docs
          ''' + s[load_input_end:]

          type_start = s.index('def type_matches(')
          type_end = s.index('\n\ndef validate_value_schema', type_start)
          s = s[:type_start] + '''def split_type_union(declaration: str) -> List[str]:
              parts: List[str] = []
              depth = 0
              start = 0
              for i, char in enumerate(declaration):
                  if char == "<":
                      depth += 1
                  elif char == ">":
                      depth = max(0, depth - 1)
                  elif char == "|" and depth == 0:
                      parts.append(declaration[start:i].strip())
                      start = i + 1
              parts.append(declaration[start:].strip())
              return [part for part in parts if part]


          def type_matches(value: Any, declaration: Any) -> bool:
              if not isinstance(declaration, str):
                  return True
              declaration = declaration.strip()
              union = split_type_union(declaration)
              if len(union) > 1:
                  return any(type_matches(value, branch) for branch in union)
              if declaration == "null":
                  return value is None
              if declaration in {"string", "external_ref", "canonical_ref", "canonical_entity_ref", "canonical_property_ref", "canonical_or_external_ref", "interpretation_provenance_ref", "local_logic_primitive_set_ref"}:
                  return isinstance(value, str) and bool(value)
              if declaration == "boolean":
                  return isinstance(value, bool)
              if declaration in {"integer", "non_negative_integer"}:
                  return isinstance(value, int) and not isinstance(value, bool) and (declaration != "non_negative_integer" or value >= 0)
              if declaration == "number":
                  return isinstance(value, (int, float)) and not isinstance(value, bool)
              if declaration.startswith("array<") and declaration.endswith(">"):
                  inner = declaration[6:-1].strip()
                  return isinstance(value, list) and all(type_matches(item, inner) for item in value)
              if declaration == "array":
                  return isinstance(value, list)
              if declaration.startswith("object") or declaration in {"map", "properties"}:
                  return isinstance(value, dict)
              # Named semantic value forms are validated by their governing rules, not guessed here.
              return True
          ''' + s[type_end:]

          replace_once(
          'def endpoint_constraint_matches(constraint: str, target_kind: str, target: Dict[str, Any], owner_entity: Optional[Dict[str, Any]]) -> bool:',
          'def endpoint_constraint_matches(constraint: str, target_kind: str, target: Dict[str, Any]) -> bool:'
          )

          # Add indexes/helpers before entity validation.
          marker = '\n\ndef validate_entities_and_properties('
          insert_at = s.index(marker)
          helpers = '''\n\ndef build_link_index(
              objects: Mapping[str, Tuple[str, ContractDocument, Dict[str, Any]]]
          ) -> Dict[Tuple[str, str, str], List[Dict[str, Any]]]:
              """Index Links by (link_type_ref, endpoint_name, endpoint_ref)."""
              index: Dict[Tuple[str, str, str], List[Dict[str, Any]]] = {}
              for _obj_id, (kind, _doc, candidate) in objects.items():
                  if kind != "Property" or candidate.get("property_type_ref") != "link":
                      continue
                  value = candidate.get("value")
                  if not isinstance(value, dict):
                      continue
                  link_type = value.get("link_type_ref")
                  if not isinstance(link_type, str):
                      continue
                  for endpoint in ("parent_ref", "child_ref"):
                      ref = value.get(endpoint)
                      if isinstance(ref, str) and ref:
                          index.setdefault((link_type, endpoint, ref), []).append(candidate)
              return index


          def canonical_owner_for_ref(
              ref: Any,
              objects: Mapping[str, Tuple[str, ContractDocument, Dict[str, Any]]],
              owners: Mapping[str, str],
          ) -> Optional[str]:
              if not isinstance(ref, str):
                  return None
              resolved = objects.get(ref)
              if resolved is None:
                  return None
              kind, _doc, _target = resolved
              if kind == "Entity":
                  return ref
              if kind == "Property":
                  return owners.get(ref)
              return None
          '''
          s = s[:insert_at] + helpers + s[insert_at:]

          replace_once(
          '''def validate_entities_and_properties(
              docs: Sequence[ContractDocument],
              standard: Standard,
              idx: Mapping[str, Any],
              objects: Mapping[str, Tuple[str, ContractDocument, Dict[str, Any]]],
              owners: Mapping[str, str],
              ctx: Context,
          ) -> None:''',
          '''def validate_entities_and_properties(
              docs: Sequence[ContractDocument],
              standard: Standard,
              idx: Mapping[str, Any],
              objects: Mapping[str, Tuple[str, ContractDocument, Dict[str, Any]]],
              owners: Mapping[str, str],
              link_index: Mapping[Tuple[str, str, str], Sequence[Dict[str, Any]]],
              ctx: Context,
          ) -> None:'''
          )

          replace_once(
              'validate_required_links(entity, effective["required_links"], doc, ep, objects, owners, idx, ctx)',
              'validate_required_links(entity, effective["required_links"], doc, ep, objects, owners, idx, link_index, ctx)'
          )

          link_start = s.index('def validate_link(')
          link_end = s.index('\n\ndef validate_required_links(', link_start)
          s = s[:link_start] + '''def validate_link(
              prop: Dict[str, Any],
              rule: Dict[str, Any],
              doc: ContractDocument,
              path: str,
              objects: Mapping[str, Tuple[str, ContractDocument, Dict[str, Any]]],
              owners: Mapping[str, str],
              ctx: Context,
          ) -> None:
              value = prop.get("value")
              if not isinstance(value, dict):
                  return
              for endpoint in ("parent_ref", "child_ref"):
                  ref = value.get(endpoint)
                  if not isinstance(ref, str) or not ref:
                      ctx.error("LINK_ENDPOINT_INVALID", doc.path, f"{path}.value.{endpoint}", f"{endpoint} must be a canonical reference")
                      continue
                  resolved = objects.get(ref)
                  if resolved is None:
                      ctx.unready("LINK_ENDPOINT_UNRESOLVED", doc.path, f"{path}.value.{endpoint}", f"Link endpoint {ref!r} is unresolved")
                      continue
                  constraints_obj = rule.get("endpoint_constraints")
                  constraints = constraints_obj.get(endpoint) if isinstance(constraints_obj, dict) else None
                  if isinstance(constraints, list) and constraints:
                      kind, _target_doc, target = resolved
                      if not any(isinstance(c, str) and endpoint_constraint_matches(c, kind, target) for c in constraints):
                          ctx.error("LINK_ENDPOINT_INCOMPATIBLE", doc.path, f"{path}.value.{endpoint}", f"endpoint {ref!r} does not satisfy {constraints}")

              # Link Property placement is canonical semantics. property_owner names a
              # semantic role; the Link Property must be owned by the Entity owning the
              # endpoint that carries that role (or by that Entity endpoint directly).
              semantic_roles = rule.get("semantic_roles") if isinstance(rule.get("semantic_roles"), dict) else {}
              property_owner_role = rule.get("property_owner")
              if isinstance(property_owner_role, str):
                  owner_endpoint = next(
                      (endpoint for endpoint, role in semantic_roles.items() if role == property_owner_role),
                      None,
                  )
                  if owner_endpoint in {"parent_ref", "child_ref"}:
                      expected_owner = canonical_owner_for_ref(value.get(owner_endpoint), objects, owners)
                      prop_id = prop.get("id")
                      actual_owner = owners.get(prop_id) if isinstance(prop_id, str) else None
                      if expected_owner is not None and actual_owner != expected_owner:
                          ctx.error(
                              "LINK_PROPERTY_OWNER_MISMATCH",
                              doc.path,
                              path,
                              f"Link Property owner {actual_owner!r} does not match Ruleset property_owner role {property_owner_role!r} resolved through {owner_endpoint} to Entity {expected_owner!r}",
                          )
          ''' + s[link_end:]

          req_start = s.index('def validate_required_links(')
          req_end = s.index('\n\ndef validate_top_level_references(', req_start)
          s = s[:req_start] + '''def validate_required_links(
              entity: Dict[str, Any],
              requirements: Sequence[Dict[str, Any]],
              doc: ContractDocument,
              path: str,
              objects: Mapping[str, Tuple[str, ContractDocument, Dict[str, Any]]],
              owners: Mapping[str, str],
              idx: Mapping[str, Any],
              link_index: Mapping[Tuple[str, str, str], Sequence[Dict[str, Any]]],
              ctx: Context,
          ) -> None:
              entity_id = entity.get("id")
              for req in requirements:
                  req_id = req.get("id")
                  ltype = req.get("link_type_ref")
                  self_role = req.get("self_role")
                  minimum = req.get("min", 0)
                  maximum = req.get("max")
                  matches = 0
                  governing = idx["link_rules_by_type"].get(ltype, []) if isinstance(ltype, str) else []
                  if len(governing) != 1:
                      ctx.error("REQUIRED_LINK_RULESET_UNRESOLVED", doc.path, path, f"Required Link {req_id!r} link_type_ref {ltype!r} does not resolve exactly one Link Ruleset")
                      continue
                  rule = governing[0]
                  semantic_roles = rule.get("semantic_roles") if isinstance(rule.get("semantic_roles"), dict) else {}
                  endpoint_for_role = next((endpoint for endpoint, role in semantic_roles.items() if role == self_role), None)
                  if endpoint_for_role not in {"parent_ref", "child_ref"}:
                      ctx.error("REQUIRED_LINK_SELF_ROLE_UNRESOLVED", doc.path, path, f"Required Link {req_id!r} self_role {self_role!r} does not resolve")
                      continue

                  candidates = link_index.get((ltype, endpoint_for_role, entity_id), []) if isinstance(ltype, str) and isinstance(entity_id, str) else []
                  for candidate in candidates:
                      value = candidate.get("value")
                      if not isinstance(value, dict):
                          continue
                      required_ref = value.get("required_link_ref")
                      if not isinstance(required_ref, dict):
                          continue
                      if required_ref.get("entity_ref") == entity_id and required_ref.get("required_link_id") == req_id:
                          matches += 1

                  if isinstance(minimum, int) and matches < minimum:
                      ctx.unready("REQUIRED_LINK_UNSATISFIED", doc.path, path, f"Entity {entity_id!r} Required Link {req_id!r} has {matches} satisfying Links; minimum is {minimum}")
                  if isinstance(maximum, int) and matches > maximum:
                      ctx.error("REQUIRED_LINK_MAX_EXCEEDED", doc.path, path, f"Entity {entity_id!r} Required Link {req_id!r} has {matches} satisfying Links; maximum is {maximum}")
          ''' + s[req_end:]

          # Default standard discovery: content-based upward search instead of one hard-coded layout.
          marker = '\n\ndef lint_standard('
          insert_at = s.index(marker)
          finder = '''\n\ndef find_default_spec_dir() -> Path:
              script_dir = Path(__file__).resolve().parent
              candidates = [script_dir, *script_dir.parents]
              failures: List[str] = []
              for candidate in candidates:
                  try:
                      load_standard(candidate)
                      return candidate
                  except Exception as exc:
                      failures.append(f"{candidate}: {exc}")
              raise RuntimeError(
                  "could not discover an unambiguous CW specification set from validator location upward; "
                  "use --spec-dir explicitly"
              )
          '''
          s = s[:insert_at] + finder + s[insert_at:]

          replace_once(
          '''    input_path = args.input.resolve()
              spec_dir = (args.spec_dir.resolve() if args.spec_dir else Path(__file__).resolve().parent.parent)
              ctx = Context()

              try:
                  standard = load_standard(spec_dir)
          ''',
          '''    input_path = args.input.resolve()
              ctx = Context()

              try:
                  spec_dir = args.spec_dir.resolve() if args.spec_dir else find_default_spec_dir()
                  standard = load_standard(spec_dir)
          ''')

          replace_once(
          '''        objects, owners = collect_canonical_objects(docs, ctx)
                  validate_entities_and_properties(docs, standard, idx, objects, owners, ctx)
          ''',
          '''        objects, owners = collect_canonical_objects(docs, ctx)
                  link_index = build_link_index(objects)
                  validate_entities_and_properties(docs, standard, idx, objects, owners, link_index, ctx)
          ''')

          # Documentation inside the script.
          s = s.replace(
              'A directory is treated as one validation set. All *.json files below the directory\nare loaded recursively and canonical references may resolve across those files.\nFilenames and directory structure never provide semantic meaning.',
              'A directory is treated as one validation set. JSON files are discovered recursively;\nCW contract candidates are selected from content, unrelated JSON files are ignored with\na warning, and canonical references may resolve across the selected CW documents.\nFilenames and directory structure never provide semantic meaning.'
          )
          s = s.replace(
              'By default the validator resolves the CW standard from the repository root relative\nto this script:',
              'By default the validator discovers an unambiguous CW standard set by searching\nfrom the validator directory upward:'
          )

          p.write_text(s, encoding='utf-8')

          # README details on directory discovery and spec lookup.
          for rp in (Path('linter/README.md'), Path('README.md')):
              if not rp.exists():
                  continue
              text = rp.read_text(encoding='utf-8')
              text = text.replace(
                  'All `*.json` files below the directory are loaded recursively as one validation set. Canonical references may resolve across those files.',
                  'JSON files below the directory are discovered recursively as one validation set. CW contract candidates are identified from their content; unrelated JSON files are ignored with a warning. Canonical references may resolve across the selected CW documents.'
              )
              text = text.replace(
                  'When a directory is supplied, all `*.json` files below that directory are loaded recursively as one validation set. Canonical references may resolve across those files.',
                  'When a directory is supplied, JSON files are discovered recursively as one validation set. CW contract candidates are identified from their content; unrelated JSON files are ignored with a warning. Canonical references may resolve across the selected CW documents.'
              )
              text = text.replace(
                  'By default the validator resolves the active standard from the repository root relative to the validator:',
                  'By default the validator discovers an unambiguous active standard by searching from its own directory upward:'
              )
              rp.write_text(text, encoding='utf-8')
          PY
      - name: Compile and run focused tests
        run: |
          python -m py_compile linter/cw_validate.py
          python - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          path = Path('linter/cw_validate.py').resolve()
          spec = importlib.util.spec_from_file_location('cw_validate_test', path)
          m = importlib.util.module_from_spec(spec)
          import sys
          sys.modules[spec.name] = m
          spec.loader.exec_module(m)

          assert m.type_matches(['A', 'B'], 'array<canonical_ref>')
          assert not m.type_matches(['A', 7], 'array<canonical_ref>')
          assert m.type_matches(None, 'required_link_ref|null')
          assert m.type_matches([1, 2], 'array<integer>')
          assert not m.type_matches([1, '2'], 'array<integer>')

          doc = m.ContractDocument(Path('test.json'), {})
          a = {'id': 'A', 'entity_type_ref': 'system'}
          b = {'id': 'B', 'entity_type_ref': 'component'}
          link = {
              'id': 'L', 'property_type_ref': 'link',
              'value': {'link_type_ref': 'dependency', 'parent_ref': 'A', 'child_ref': 'B'}
          }
          objects = {
              'A': ('Entity', doc, a), 'B': ('Entity', doc, b), 'L': ('Property', doc, link)
          }
          idx = m.build_link_index(objects)
          assert idx[('dependency', 'child_ref', 'B')] == [link]

          rule = {
              'semantic_roles': {'parent_ref': 'dependency_target', 'child_ref': 'dependent'},
              'property_owner': 'dependent'
          }
          ctx = m.Context()
          m.validate_link(link, rule, doc, '$.entities[0].properties[0]', objects, {'L': 'A'}, ctx)
          assert any(f.code == 'LINK_PROPERTY_OWNER_MISMATCH' for f in ctx.findings)

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              (root / 'cw.json').write_text('{"format":{"contract_format":"CANONICAL_CONTRACT"}}', encoding='utf-8')
              (root / 'settings.json').write_text('{"theme":"dark"}', encoding='utf-8')
              ctx = m.Context()
              docs = m.load_input(root, ctx)
              assert len(docs) == 1
              assert docs[0].path.name == 'cw.json'
              assert any(f.code == 'NON_CW_JSON_IGNORED' for f in ctx.findings)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linter/cw_validate.py linter/README.md README.md
          git commit -m 'Harden generic CW artifact validator'
          git push origin HEAD:linter/cw-artifact-validator-v1
