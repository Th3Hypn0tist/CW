name: One-shot Rulesets 3.11.2 bump

on:
  push:
    branches:
      - linter/spec-integrity-v1
    paths:
      - 'linter/_bump_rulesets_3_11_2.py'
      - '.github/workflows/_bump-rulesets-3.11.2.yml'

permissions:
  contents: write

jobs:
  bump:
    if: github.repository == 'Th3Hypn0tist/CW'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: linter/spec-integrity-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate Rulesets 3.11.2
        run: python linter/_bump_rulesets_3_11_2.py

      - name: Validate generated locked specification set
        run: python linter/cw_spec_lint.py --coverage

      - name: Remove one-shot migration machinery
        run: |
          rm linter/_bump_rulesets_3_11_2.py
          rm .github/workflows/_bump-rulesets-3.11.2.yml

      - name: Commit generated locked artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lock CW Rulesets 3.11.2"
          git push origin HEAD:linter/spec-integrity-v1
