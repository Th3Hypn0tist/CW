name: Owner-local package validator migration

on:
  push:
    branches:
      - fix/owner-local-package-regressions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/owner-local-package-regressions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch package validator
        run: python Tools/fix_owner_local_package_validator.py
      - name: Compile patched validator
        run: python -m py_compile linter/cw_package_validate.py
      - name: Validate golden package
        run: python linter/cw_package_validate.py Examples/Ultralight_CMS --json
      - name: Run core regressions
        run: python -m unittest discover -s linter/tests -v
      - name: Run CIC release gate
        run: python -m tools.CIC release-check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linter/cw_package_validate.py
          git commit -m "Make package validator owner-aware"
          git push origin HEAD:fix/owner-local-package-regressions
