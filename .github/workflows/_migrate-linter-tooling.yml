name: One-shot linter tooling migration

on:
  push:
    branches:
      - main
    paths:
      - 'linter/_migrate_tooling_imports.py'
      - '.github/workflows/_migrate-linter-tooling.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'Th3Hypn0tist/CW'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Disable workflow mutation in migration script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('linter/_migrate_tooling_imports.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('    migrate_workflow()\n', '')
          p.write_text(t, encoding='utf-8')
          PY

      - name: Apply tooling migration
        run: python linter/_migrate_tooling_imports.py

      - name: Compile tooling
        run: python -m py_compile linter/__init__.py linter/cw_spec_common.py linter/cw_spec_lint.py linter/cw_validate.py

      - name: Verify direct execution
        run: python linter/cw_spec_lint.py --coverage

      - name: Verify package imports
        run: python -c "import linter.cw_spec_common, linter.cw_spec_lint, linter.cw_validate"

      - name: Verify validator imports shared linter
        run: python -c "from pathlib import Path; from linter import cw_validate; ok,msg=cw_validate.lint_standard(Path('.')); print(msg); raise SystemExit(0 if ok else 1)"

      - name: Remove generated caches and migration script
        run: |
          rm -rf linter/__pycache__
          rm linter/_migrate_tooling_imports.py

      - name: Commit tooling cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align CW linter imports and topology checks"
          git push origin HEAD:main
