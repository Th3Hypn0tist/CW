name: Temporary PR5 validator cleanup

on:
  push:
    branches:
      - linter/cw-artifact-validator-cleanup-v1
    paths:
      - '.github/workflows/_tmp-pr5-validator-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linter/cw-artifact-validator-cleanup-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply focused validator cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('linter/cw_validate.py')
          s = p.read_text(encoding='utf-8')

          old = '''def find_default_spec_dir() -> Path:\n    script_dir = Path(__file__).resolve().parent\n    candidates = [script_dir, *script_dir.parents]\n    failures: List[str] = []\n    for candidate in candidates:\n        try:\n            load_standard(candidate)\n            return candidate\n        except Exception as exc:\n            failures.append(f"{candidate}: {exc}")\n    raise RuntimeError(\n        "could not discover an unambiguous CW specification set from validator location upward; "\n        "use --spec-dir explicitly"\n    )\n'''
          new = '''def find_default_standard() -> Tuple[Path, Standard]:\n    script_dir = Path(__file__).resolve().parent\n    candidates = [script_dir, *script_dir.parents]\n    for candidate in candidates:\n        try:\n            return candidate, load_standard(candidate)\n        except Exception:\n            pass\n        if (candidate / ".git").exists():\n            break\n    raise RuntimeError(\n        "could not discover an unambiguous CW specification set from validator location up to the repository root; "\n        "use --spec-dir explicitly"\n    )\n'''
          if old not in s:
              raise SystemExit('find_default_spec_dir block not found')
          s = s.replace(old, new, 1)

          old = '''    parser.add_argument("--spec-dir", type=Path, default=None, help="override CW specification directory; default is repository root relative to this script")\n'''
          new = '''    parser.add_argument("--spec-dir", type=Path, default=None, help="override CW specification directory; default searches upward from this validator to the repository root")\n'''
          if old not in s:
              raise SystemExit('--spec-dir help text not found')
          s = s.replace(old, new, 1)

          old = '''    try:\n        spec_dir = args.spec_dir.resolve() if args.spec_dir else find_default_spec_dir()\n        standard = load_standard(spec_dir)\n'''
          new = '''    try:\n        if args.spec_dir:\n            spec_dir = args.spec_dir.resolve()\n            standard = load_standard(spec_dir)\n        else:\n            spec_dir, standard = find_default_standard()\n'''
          if old not in s:
              raise SystemExit('main standard-loading block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile validator
        run: python -m py_compile linter/cw_validate.py
      - name: Smoke test CLI help
        run: python linter/cw_validate.py --help | grep -F 'searches upward from this validator to the repository root'
      - name: Commit focused cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add linter/cw_validate.py
          git commit -m 'Tighten validator specification discovery'
          git push origin HEAD:linter/cw-artifact-validator-cleanup-v1
