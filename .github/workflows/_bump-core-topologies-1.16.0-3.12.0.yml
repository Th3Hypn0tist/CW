name: One-shot core topology spec migration

on:
  push:
    branches:
      - main
    paths:
      - 'linter/_bump_core_topologies_1_16_0_3_12_0.py'
      - '.github/workflows/_bump-core-topologies-1.16.0-3.12.0.yml'

permissions:
  contents: write

jobs:
  bump:
    if: github.repository == 'Th3Hypn0tist/CW'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate NodeTypes 1.16.0 and Rulesets 3.12.0
        run: python linter/_bump_core_topologies_1_16_0_3_12_0.py

      - name: Validate generated specification set
        run: python linter/cw_spec_lint.py --coverage

      - name: Remove one-shot migration machinery
        run: |
          rm linter/_bump_core_topologies_1_16_0_3_12_0.py
          rm .github/workflows/_bump-core-topologies-1.16.0-3.12.0.yml

      - name: Commit locked specification artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lock CW NodeTypes 1.16.0 and Rulesets 3.12.0"
          git push origin HEAD:main
