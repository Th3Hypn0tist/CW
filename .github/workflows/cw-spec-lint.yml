name: CW Integrity

on:
  pull_request:
    paths:
      - 'Canonical_Contract_Format_v*.json'
      - 'CanonicalWireframe_NodeTypes_v*.json'
      - 'CanonicalWireframe_Dependency_Rules_v*.json'
      - 'spec_sets/**'
      - 'linter/**'
      - 'tools/CIC/**'
      - 'Examples/Ultralight_CMS/**'
      - '.github/workflows/cw-spec-lint.yml'
  push:
    paths:
      - 'Canonical_Contract_Format_v*.json'
      - 'CanonicalWireframe_NodeTypes_v*.json'
      - 'CanonicalWireframe_Dependency_Rules_v*.json'
      - 'spec_sets/**'
      - 'linter/**'
      - 'tools/CIC/**'
      - 'Examples/Ultralight_CMS/**'
      - '.github/workflows/cw-spec-lint.yml'

permissions:
  contents: read

jobs:
  integrity:
    name: CW package and CIC integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile CW tooling
        run: |
          python -m py_compile \
            linter/__init__.py \
            linter/cw_spec_common.py \
            linter/cw_spec_lint.py \
            linter/cw_compose.py \
            linter/cw_bind.py \
            linter/cw_version.py \
            linter/cw_validate.py \
            linter/cw_package_validate.py \
            tools/CIC/*.py \
            tools/CIC/modules/*.py

      - name: Validate historical locked specification set
        run: python linter/cw_spec_lint.py --coverage

      - name: Validate current Ultralight CMS golden package
        run: python linter/cw_package_validate.py Examples/Ultralight_CMS --json

      - name: Run CW Core regression tests
        run: python -m unittest discover -s linter/tests -v

      - name: Run CIC package release gate
        run: python -m tools.CIC release-check

      - name: Emit machine-readable reports
        if: always()
        run: |
          mkdir -p artifacts
          python linter/cw_spec_lint.py --json > artifacts/cw-spec-lint-report.json || true
          python linter/cw_package_validate.py Examples/Ultralight_CMS --json > artifacts/cw-package-report.json || true
          python -m tools.CIC release-check > artifacts/cic-release-report.json || true

      - name: Upload integrity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-integrity-reports
          path: artifacts/*.json
          if-no-files-found: error
