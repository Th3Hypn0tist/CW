name: CW Specification Integrity

on:
  pull_request:
    paths:
      - 'Canonical_Contract_Format_v*.json'
      - 'CanonicalWireframe_NodeTypes_v*.json'
      - 'CanonicalWireframe_Dependency_Rules_v*.json'
      - 'spec_sets/**'
      - 'linter/**'
      - '.github/workflows/cw-spec-lint.yml'
  push:
    paths:
      - 'Canonical_Contract_Format_v*.json'
      - 'CanonicalWireframe_NodeTypes_v*.json'
      - 'CanonicalWireframe_Dependency_Rules_v*.json'
      - 'spec_sets/**'
      - 'linter/**'
      - '.github/workflows/cw-spec-lint.yml'

permissions:
  contents: read

jobs:
  specification-integrity:
    name: CW specification integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile CW tooling
        run: python -m py_compile linter/__init__.py linter/cw_spec_common.py linter/cw_spec_lint.py linter/cw_compose.py linter/cw_bind.py linter/cw_version.py linter/cw_validate.py

      - name: Verify package imports
        run: python -c "import linter.cw_spec_common, linter.cw_spec_lint, linter.cw_compose, linter.cw_bind, linter.cw_version, linter.cw_validate"

      - name: Validate locked CW specification set
        run: python linter/cw_spec_lint.py --coverage

      # Keep generated reports outside the root *.json specification scan.
      - name: Emit machine-readable report
        if: always()
        run: |
          mkdir -p .artifacts
          python linter/cw_spec_lint.py --json > .artifacts/cw-spec-lint-report.json || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-spec-lint-report
          path: .artifacts/cw-spec-lint-report.json
          if-no-files-found: error
